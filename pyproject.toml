[project]
name = "true_fps"
version = "0.1.0"
description = "Измерение FPS видео по временным меткам ffprobe"
authors = [{ name = "Oleg Migutin" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = []

[tool.poetry]
packages = [{ include = "true_fps", from = "src" }]
include = [
    "src/true_fps/py.typed",
    { path = "tests", format = "sdist" },
    { path = "docs", format = "sdist" },
    { path = "poetry.lock", format = "sdist" },
]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3,<10"
ruff = ">=0.11,<1"
mypy = ">=1.15,<2"

[build-system]
requires = ["poetry-core>=2.2,<3"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: проверки с настоящими ffprobe и ffmpeg"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]
